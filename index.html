<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04121f" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="大水槽" />
  <title>大水槽 — バーチャル水族館</title>
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="./src/style.css" />
  <!-- ビルドなし配信(GitHub Pagesのブランチ直配信)でも動くように、
       three.js を同梱の vendor/ から import map で解決する。
       Vite でのビルド時は bare import が node_modules から束ねられるため、この map は無害 -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>
    <div id="vignette"></div>

    <!-- 行き先はポータルエリアで選ぶ。ここは「戻る」1つだけ。
         水槽が増えてもこのボタンは増えない -->
    <button id="hubBtn" type="button" hidden>
      <span class="hi">🛰</span>ポータルへ戻る
    </button>

    <header id="hud-title">
      <h1>大水槽 <span>GRAND AQUARIUM</span></h1>
      <p class="hint">
        ドラッグ: 見回す / 右ドラッグ: 移動 / ホイール: 前進後退<br />
        WASD+E・Q: 遊泳(Shiftで加速) / E を押し続けると水上へ / <span id="tapHint">クリック: 魚が驚く</span>
      </p>
    </header>

    <div id="hud-left">
      <div class="ctl">
        <label for="sunSlider">太陽光</label>
        <input id="sunSlider" type="range" min="30" max="170" value="100" />
      </div>
      <div class="ctl-row">
        <button id="feedBtn" class="chip feed" type="button">🦐 えさをまく</button>
        <button id="soundBtn" class="chip" type="button">🔇 環境音</button>
        <button id="guideBtn" class="chip" type="button">▶ 遊び方</button>
        <button id="freeBtn" class="chip hidden" type="button">✕ 追跡解除</button>
      </div>
      <div id="fps"></div>
    </div>

    <button id="panelToggle" type="button" aria-label="生物図鑑">🐟 図鑑</button>
    <aside id="panel">
      <h2>展示生物</h2>
      <div id="cards"></div>
      <footer>生物のカードを押すとカメラが追跡します</footer>
    </aside>

    <div id="infoPop" class="hidden"></div>

    <!-- 遊び方の動画。media/ はビルド時に dist/ へそのままコピーされるので、
         ビルドあり・なしのどちらの配信でも同じ相対パスで解決できる -->
    <div id="guide" class="hidden">
      <div id="guideBox">
        <div id="guideHead">
          <span>遊び方</span>
          <button id="guideClose" type="button" aria-label="閉じる">✕</button>
        </div>
        <!-- source は開いたときに JS で入れる。HTMLに書くと Vite が assets/ へ
             ハッシュ付きで複製してしまい、media/ と二重に入る。
             遅延指定なので、遊び方を開くまで一切ダウンロードされない。
             H.264 を持たないブラウザ(一部の Linux ビルドなど)向けに
             WebM/VP9 も置き、再生できるほうが選ばれるようにしている。 -->
        <video id="guideVideo" controls playsinline preload="none"></video>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
